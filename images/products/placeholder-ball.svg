<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="ballShade" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e9ecef"/>
      <stop offset="100%" stop-color="#adb5bd"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="400" height="400" fill="#f8f9fa"/>
  
  <!-- Ball Outer Circle -->
  <circle cx="200" cy="200" r="150" fill="url(#ballShade)" stroke="#212529" stroke-width="4" filter="url(#shadow)"/>
  
  <!-- Central Pentagon -->
  <polygon points="200,160 235,185 222,225 178,225 165,185" fill="#212529"/>
  
  <!-- Surrounding Pentagons / Lines -->
  <!-- Top line & patch -->
  <line x1="200" y1="160" x2="200" y2="90" stroke="#212529" stroke-width="4"/>
  <polygon points="200,90 225,65 175,65" fill="#343a40"/>
  
  <!-- Top Right line & patch -->
  <line x1="235" y1="185" x2="300" y2="160" stroke="#212529" stroke-width="4"/>
  <polygon points="300,160 335,185 320,130" fill="#343a40"/>
  
  <!-- Bottom Right line & patch -->
  <line x1="222" y1="225" x2="275" y2="280" stroke="#212529" stroke-width="4"/>
  <polygon points="275,280 295,325 240,315" fill="#343a40"/>
  
  <!-- Bottom Left line & patch -->
  <line x1="178" y1="225" x2="125" y2="280" stroke="#212529" stroke-width="4"/>
  <polygon points="125,280 160,315 105,325" fill="#343a40"/>
  
  <!-- Top Left line & patch -->
  <line x1="165" y1="185" x2="100" y2="160" stroke="#212529" stroke-width="4"/>
  <polygon points="100,160 80,130 65,185" fill="#343a40"/>

  <!-- Connecting Edges -->
  <line x1="200" y1="90" x2="270" y2="115" stroke="#212529" stroke-width="3"/>
  <line x1="270" y1="115" x2="300" y2="160" stroke="#212529" stroke-width="3"/>
  <line x1="300" y1="160" x2="310" y2="235" stroke="#212529" stroke-width="3"/>
  <line x1="310" y1="235" x2="275" y2="280" stroke="#212529" stroke-width="3"/>
  <line x1="200" y1="90" x2="130" y2="115" stroke="#212529" stroke-width="3"/>
  <line x1="130" y1="115" x2="100" y2="160" stroke="#212529" stroke-width="3"/>
  <line x1="100" y1="160" x2="90" y2="235" stroke="#212529" stroke-width="3"/>
  <line x1="90" y1="235" x2="125" y2="280" stroke="#212529" stroke-width="3"/>
  <line x1="160" y1="315" x2="240" y2="315" stroke="#212529" stroke-width="3"/>

  <!-- Brand watermark badge -->
  <rect x="130" y="345" width="140" height="26" rx="6" fill="#1b4332" opacity="0.9"/>
  <text x="200" y="362" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">GOALGEAR</text>
</svg>
