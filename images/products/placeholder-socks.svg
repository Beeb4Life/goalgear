<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="sockShade" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f3f5"/>
      <stop offset="100%" stop-color="#ced4da"/>
    </radialGradient>
    <filter id="sockShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="#f8f9fa"/>

  <!-- Football Sock Graphic -->
  <g filter="url(#sockShadow)">
    <!-- Main Sock Body -->
    <path d="M 150 70 L 220 70 L 220 220 C 220 250 250 270 290 280 C 310 285 315 295 305 310 C 285 330 240 330 200 310 C 160 290 150 250 150 220 Z" fill="url(#sockShade)" stroke="#212529" stroke-width="4"/>

    <!-- Ribbed Cuff at Top -->
    <rect x="148" y="70" width="74" height="24" fill="#1b4332" stroke="#212529" stroke-width="3"/>
    <line x1="162" y1="70" x2="162" y2="94" stroke="#ffffff" stroke-width="2"/>
    <line x1="176" y1="70" x2="176" y2="94" stroke="#ffffff" stroke-width="2"/>
    <line x1="190" y1="70" x2="190" y2="94" stroke="#ffffff" stroke-width="2"/>
    <line x1="204" y1="70" x2="204" y2="94" stroke="#ffffff" stroke-width="2"/>

    <!-- Compression Band / Striping -->
    <path d="M 150 140 L 220 140 L 220 160 L 150 160 Z" fill="#2d6a4f"/>
    <path d="M 150 170 L 220 170 L 220 176 L 150 176 Z" fill="#212529"/>

    <!-- Grip Pads on Sole -->
    <rect x="210" y="300" width="12" height="6" rx="3" fill="#1b4332"/>
    <rect x="230" y="305" width="12" height="6" rx="3" fill="#1b4332"/>
    <rect x="250" y="300" width="12" height="6" rx="3" fill="#1b4332"/>
    <rect x="270" y="292" width="12" height="6" rx="3" fill="#1b4332"/>
    <rect x="190" y="280" width="10" height="5" rx="2.5" fill="#1b4332"/>
    <rect x="205" y="275" width="10" height="5" rx="2.5" fill="#1b4332"/>

    <!-- Heel Reinforcement -->
    <path d="M 150 220 C 150 250 170 270 190 270 C 180 250 175 235 175 220 Z" fill="#ced4da"/>
  </g>

  <!-- Watermark Badge -->
  <rect x="130" y="340" width="140" height="26" rx="6" fill="#1b4332" opacity="0.9"/>
  <text x="200" y="357" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">GOALGEAR SOCKS</text>
</svg>
